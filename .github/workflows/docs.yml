name: Build & Publish MkDocs Handbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lms-handbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate handbook
        run: mkdocs build --strict

      - name: Publish website to gh-pages/docs
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          rm -rf /tmp/lms-gh-pages
          git clone --branch gh-pages --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/lms-gh-pages

          rm -rf /tmp/lms-gh-pages/docs
          mkdir -p /tmp/lms-gh-pages/docs
          cp -a site/. /tmp/lms-gh-pages/docs/
          touch /tmp/lms-gh-pages/docs/.nojekyll

          cd /tmp/lms-gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs

          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi

          git commit -m "Deploy ${GITHUB_SHA} to gh-pages/docs"
          git push origin gh-pages
